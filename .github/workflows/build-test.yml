name: Run build test

# 原来只在 PR → dev 时跑，而仓库主干是 main —— 也就是说合并进主干的代码从来没经过这层检查。
on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Eslint check
        run: npm run lint

      - name: Test Build
        run: npm run build-test
